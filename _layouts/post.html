---
layout: default
---
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "description": {{ page.description | default: page.excerpt | strip_html | truncate: 200 | jsonify }},
  "url": "{{ page.url | absolute_url }}",
  "author": {
    "@type": "Person",
    "name": "Chris Down",
    "url": "https://chrisdown.name"
  },
  "publisher": {
    "@type": "Person",
    "name": "Chris Down",
    "url": "https://chrisdown.name"
  }
}
</script>
<h1>{{ page.title }}</h1>

{% if page.hidden %}
<b>Note: this page is hidden from the main index, likely because it is out of
date. Please bear that in mind while reading.</b>

<hr>
{% endif %}
{{ content }}
